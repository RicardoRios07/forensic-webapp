# Configuración de Apache para Reverse Proxy
# Guardar en: /etc/apache2/sites-available/forensic-webapp.conf
# Copiar con: sudo cp forensic-webapp.conf /etc/apache2/sites-available/
# Habilitar con: sudo a2ensite forensic-webapp && sudo systemctl reload apache2

<VirtualHost *:80>
    # Información del servidor
    ServerName forensic-webapp.local
    ServerAlias localhost
    ServerAdmin admin@localhost
    
    # ====================================================================
    # LOGGING
    # ====================================================================
    ErrorLog ${APACHE_LOG_DIR}/forensic-error.log
    CustomLog ${APACHE_LOG_DIR}/forensic-access.log combined
    LogLevel warn
    
    # ====================================================================
    # PROXY SETTINGS
    # ====================================================================
    
    # Habilitar proxy HTTP
    ProxyPreserveHost On
    ProxyPass / http://localhost:3000/ timeout=300 connectiontimeout=300
    ProxyPassReverse / http://localhost:3000/
    
    # ====================================================================
    # HEADERS
    # ====================================================================
    
    # Headers de proxy
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Host "%{SERVER_NAME}s"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    
    # Headers de respuesta
    Header set X-Frame-Options "SAMEORIGIN"
    Header set X-Content-Type-Options "nosniff"
    Header set X-XSS-Protection "1; mode=block"
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    
    # ====================================================================
    # WebSocket Support
    # ====================================================================
    RewriteEngine On
    RewriteCond %{HTTP:Connection} Upgrade [NC]
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteRule ^/?(.*) "ws://localhost:3000/$1" [P,L]
    
    # ====================================================================
    # COMPRESSION (Gzip)
    # ====================================================================
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html
        AddOutputFilterByType DEFLATE text/plain
        AddOutputFilterByType DEFLATE text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE text/javascript
        AddOutputFilterByType DEFLATE application/javascript
        AddOutputFilterByType DEFLATE application/json
        AddOutputFilterByType DEFLATE application/xml
        
        # No comprimir imágenes
        DeflateExcludeTypes image/png image/jpg image/jpeg image/gif
    </IfModule>
    
    # ====================================================================
    # CACHING (para assets estáticos)
    # ====================================================================
    <FilesMatch "\.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>
    
    <FilesMatch "\.(html)$">
        Header set Cache-Control "max-age=3600, must-revalidate"
    </FilesMatch>
    
    # ====================================================================
    # TIMEOUTS
    # ====================================================================
    ProxyTimeout 300
    ProxyBadHeader Ignore
    
    # ====================================================================
    # SEGURIDAD BÁSICA
    # ====================================================================
    
    # Bloquear acceso directo a archivos de configuración
    <FilesMatch "^\.env|\.git|package\.json|docker-compose\.yml">
        Deny from all
    </FilesMatch>
    
    # Limitar métodos HTTP
    AllowMethods GET POST PUT DELETE HEAD
    
    # ====================================================================
    # DIRECTORIOS
    # ====================================================================
    <Directory />
        Require all granted
    </Directory>

</VirtualHost>

